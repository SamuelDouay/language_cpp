name: Build, Test and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # =========================================================
      # LINUX
      # =========================================================

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 \
            g++-14 \
            gcovr

          gcc-14 --version
          g++-14 --version
          gcovr --version

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON

      # =========================================================
      # MACOS
      # =========================================================

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install gcc
          brew install gcovr

          echo "Homebrew GCC:"
          brew --prefix gcc

          echo "Installed GCC versions:"
          ls "$(brew --prefix gcc)/bin"/g++-* || true

          gcovr --version

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          GCC_PREFIX="$(brew --prefix gcc)"

          GXX="$(find "$GCC_PREFIX/bin" -name 'g++-[0-9]*' -type f | sort -V | tail -n 1)"
          GCC="$(find "$GCC_PREFIX/bin" -name 'gcc-[0-9]*' -type f | sort -V | tail -n 1)"

          echo "Using GCC:  $GCC"
          echo "Using G++:  $GXX"

          "$GCC" --version
          "$GXX" --version

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$GCC" \
            -DCMAKE_CXX_COMPILER="$GXX" \
            -DENABLE_COVERAGE=ON

      # =========================================================
      # WINDOWS / MSYS2 UCRT64
      # =========================================================

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcovr
            make
            git

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          gcc --version
          g++ --version
          gcov --version
          gcovr --version
          cmake --version

          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DENABLE_COVERAGE=ON

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build build --config Debug --parallel 2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build --config Debug --parallel 2

      # =========================================================
      # TESTS
      # =========================================================

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ctest \
            --test-dir build \
            --build-config Debug \
            --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ctest \
            --test-dir build \
            --build-config Debug \
            --output-on-failure

      # =========================================================
      # COVERAGE
      # =========================================================

      - name: Generate coverage report (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export GCOV=gcov-14
          fi
          mkdir -p build/coverage_report

          gcovr \
            -r . \
            --xml-pretty \
            --exclude '.*/externals/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*main\.cpp$' \
            --delete \
            -o build/coverage.xml

          gcovr \
            -r . \
            --html-details \
            --exclude '.*/externals/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*main\.cpp$' \
            --delete \
            -o build/coverage_report/index.html

      - name: Generate coverage report (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p build/coverage_report

          gcovr \
            -r . \
            --xml-pretty \
            --exclude '.*/externals/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*main\.cpp$' \
            --delete \
            -o build/coverage.xml

          gcovr \
            -r . \
            --html-details \
            --exclude '.*/externals/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*main\.cpp$' \
            --delete \
            -o build/coverage_report/index.html

      # =========================================================
      # CODECOV
      # =========================================================

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.xml
          disable_search: true
          flags: ${{ runner.os }}
          name: codecov-${{ runner.os }}
          fail_ci_if_error: true