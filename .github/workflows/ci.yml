name: Build, Test and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- Installation des outils ----------
      - name: Install coverage tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcovr
          # Vérifier la version de g++-14
          g++-14 --version

      - name: Install coverage tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          brew install pipx
          pipx ensurepath
          pipx install gcovr

      - name: Install MinGW and gcovr (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y
          # Ajouter le dossier bin au PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          python -m pip install gcovr

      # ---------- Configuration CMake ----------
      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Configure CMake (Windows avec MinGW)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc

      # ---------- Compilation ----------
      - name: Build
        run: cmake --build build --config Debug -j 2

      # ---------- Tests ----------
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Debug

      # ---------- Couverture ----------
      - name: Generate coverage report
        working-directory: build
        run: cmake --build . --target coverage

      # ---------- Upload Codecov ----------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.xml
          flags: ${{ runner.os }}
          name: codecov-${{ matrix.os }}
          fail_ci_if_error: true